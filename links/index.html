<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luana Guimarães | Links</title>
<meta name="description" content="Links da Luana Guimarães, criadora UGC e designer: portfólio, Instagram e TikTok.">
<meta name="theme-color" content="#FDF8E1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,400..900;1,400..900&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

<!-- conta a visita no painel (mesmo esquema do portfólio) -->
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<style>
  :root {
    --fundo: #FDF8E1; --tinta: #2B2B2B; --tinta-suave: #555050;
    --rosa: #C72D67; --rosa-escuro: #A3204F; --rosa-claro: #EA70A5; --azul-claro: #CFDFFC; --estrela: #A9C1F3; --branco: #FFFFFF;
    --degrade: linear-gradient(120deg, #C72D67 0%, #EA70A5 100%);
    --serif: "Mulish", "Trebuchet MS", sans-serif;
    --sans: "Open Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; min-height: 100dvh; color: var(--tinta); font: 16px/1.5 var(--sans);
    background: var(--fundo) radial-gradient(rgba(199, 45, 103, .13) 1.2px, transparent 1.4px) 0 0 / 22px 22px;
    display: flex; justify-content: center; align-items: flex-start; padding: 16px 16px 32px; overflow-x: hidden;
  }
  :focus-visible { outline: 3px solid var(--rosa); outline-offset: 3px; border-radius: 6px; }

  /* janela, no estilo do card da tabela de investimentos do portfólio */
  .janela {
    width: 100%; max-width: 460px; border-radius: 22px; overflow: hidden;
    background: linear-gradient(180deg, #FFFBF0 0%, #FFF3F7 100%);
    border: 1px solid rgba(43, 43, 43, .07); box-shadow: 0 40px 80px -40px rgba(20, 17, 13, .35);
  }
  .barra { position: relative; z-index: 3; display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    border-bottom: 1px solid rgba(43, 43, 43, .08); background: linear-gradient(180deg, #FFF0F6, #FFE6F0); }
  .barra .estrela { width: 26px; height: 26px; flex-shrink: 0; color: var(--estrela); transform: rotate(-12deg); }
  .estrela path { fill: currentColor; }
  .barra-nome { flex: 1; min-width: 0; text-align: center; font-size: 13px; font-weight: 600; color: var(--tinta-suave); letter-spacing: .02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .idioma { flex-shrink: 0; border: 1px solid rgba(43, 43, 43, .16); background: transparent; color: var(--tinta-suave); border-radius: 999px;
    font: 700 11px var(--sans); letter-spacing: .08em; padding: 5px 10px; cursor: pointer; transition: background .2s, color .2s; }
  .idioma:hover { background: var(--azul-claro); color: var(--tinta); }

  .corpo { position: relative; padding: 0 clamp(18px, 6vw, 34px) 30px; text-align: center; }

  /* ===== CRACHÁ (o mesmo do portfólio, recortado da foto cracha.webp de 1847 x 2000 px) ===== */
  .cracha-area { display: flex; justify-content: center; margin-top: calc(-1 * min(96px, 26vw)); } /* o cordão sai de baixo da barra */
  .cracha-entrada { width: min(172px, 46vw); transform-origin: 50.6% 0; will-change: transform; }
  .cracha-entrada.esperando { visibility: hidden; }
  .cracha { width: 100%; transform-origin: 50.6% 0; will-change: transform; }
  .cracha-pulo.pulando { animation: pulinho .55s cubic-bezier(.3, .6, .35, 1); }
  @keyframes pulinho { 0% { transform: translateY(0); } 38% { transform: translateY(-14px); } 72% { transform: translateY(2px); } 100% { transform: translateY(0); } }
  .cracha-cordao { aspect-ratio: 735 / 634; background: url("../cracha.webp?v=4") 47.842% 0 / 251.29% auto no-repeat; }
  .cracha-cartao {
    position: relative; display: block; width: 100%; aspect-ratio: 735 / 1101; margin-top: -1px;
    padding: 0; border: 0; background: none; cursor: pointer; perspective: 1600px;
    border-radius: 8.44% / 5.63%; container-type: inline-size;
  }
  .cracha-cartao:focus-visible { outline-offset: 6px; }
  .cracha-giro { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 1.05s cubic-bezier(.45, .05, .2, 1); }
  .cracha-cartao.virado .cracha-giro { transform: rotateY(180deg); }
  .cracha-face {
    position: absolute; inset: 0; border-radius: 8.44% / 5.63%;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
    filter: drop-shadow(0 1px 1.5px rgba(20, 17, 13, .10)) drop-shadow(0 16px 26px rgba(20, 17, 13, .13));
  }
  .cracha-frente { background: url("../cracha.webp?v=4") 47.842% 70.523% / 251.29% auto no-repeat; background-color: #F6F6F6; }
  .cracha-face::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .4s; mix-blend-mode: multiply;
    background: linear-gradient(125deg, #FFC9E0 0%, #CADBFF 22%, #FFF0B3 44%, #C4F1E1 66%, #E8C9FF 84%, #FFC9E0 100%) var(--cx, 50%) var(--cy, 30%) / 260% 260%;
  }
  .cracha-face::before {
    content: ""; position: absolute; inset: 0; z-index: 1; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .4s; mix-blend-mode: screen;
    background: radial-gradient(circle at var(--cx, 50%) var(--cy, 30%), rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 45%);
  }
  .cracha-verso::after, .cracha-verso::before { --cx: var(--cxi, 50%); }
  .cracha-cartao:hover .cracha-face::after, .cracha-cartao:focus-visible .cracha-face::after { opacity: .45; }
  .cracha-cartao:hover .cracha-face::before, .cracha-cartao:focus-visible .cracha-face::before { opacity: .6; }
  .cracha-verso { transform: rotateY(180deg); display: flex; align-items: flex-end; padding: 0 11% 13%;
    background: linear-gradient(180deg, #F7F7F7 0%, #F6F6F6 20%, #F3F3F3 100%); }
  .cracha-texto { font-family: var(--serif); font-weight: 800; font-size: 10.5cqi; line-height: 1.08; letter-spacing: -.02em; color: var(--tinta); text-align: left; }
  .cracha-e { background: var(--degrade); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .cracha-gancho {
    position: absolute; top: 0; left: 42.721%; width: 16.871%; aspect-ratio: 124 / 150; z-index: 2; pointer-events: none;
    background: url("../cracha.webp?v=4") 49.100% 34.270% / 1489.52% auto no-repeat;
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 6%, #000 94%, transparent 100%);
    mask-image: linear-gradient(to right, transparent 0, #000 6%, #000 94%, transparent 100%);
    mix-blend-mode: multiply; filter: brightness(1.045);
  }
  .dica-cracha { margin: 8px 0 0; font-size: 12px; color: var(--tinta-suave); opacity: .8; }

  /* estrelinhas em volta do crachá */
  .estrela-solta { position: absolute; pointer-events: none; animation: girar 20s linear infinite; }
  .estrela-solta.e1 { width: 34px; top: 120px; left: 9%; color: var(--estrela); }
  .estrela-solta.e2 { width: 22px; top: 250px; right: 11%; color: #F6BFD6; animation-direction: reverse; animation-duration: 26s; }
  .estrela-solta.e3 { width: 16px; top: 80px; right: 20%; color: var(--estrela); animation-duration: 32s; }
  @keyframes girar { to { transform: rotate(360deg); } }

  /* ===== TEXTO ===== */
  .balao {
    position: relative; display: inline-block; margin: 18px auto 14px; padding: 12px 22px; border-radius: 999px;
    background: var(--branco); border: 1px solid rgba(43, 43, 43, .08); box-shadow: 0 16px 30px -22px rgba(199, 45, 103, .55);
  }
  .balao::before { /* biquinho do balão apontando para o crachá */
    content: ""; position: absolute; left: 50%; top: -8px; width: 16px; height: 16px; margin-left: -8px; transform: rotate(45deg);
    background: var(--branco); border-left: 1px solid rgba(43, 43, 43, .08); border-top: 1px solid rgba(43, 43, 43, .08); border-radius: 3px 0 0 0;
  }
  h1 { font-family: var(--serif); font-weight: 800; font-size: clamp(24px, 7vw, 30px); line-height: 1.05; letter-spacing: -.03em; margin: 0; }
  h1 em { font-style: normal; background: var(--degrade); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .cargo { margin: 0 0 6px; font-family: var(--serif); font-weight: 800; font-size: 17px; line-height: 1.3; letter-spacing: -.01em; }
  .frase { margin: 0 auto 20px; max-width: 32ch; color: var(--tinta-suave); font-size: 15px; }
  .frase em { font-style: normal; font-weight: 600; color: var(--rosa); }

  /* ===== BOTÕES ===== */
  .botoes { display: grid; gap: 12px; }
  .botao {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 19px 22px; border-radius: 12px;
    font: 800 15px/1.2 var(--serif); letter-spacing: .06em; text-transform: uppercase; text-decoration: none; text-align: left;
    transition: transform .2s, box-shadow .2s, filter .2s;
  }
  .botao svg { width: 18px; height: 18px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .botao.principal { background: var(--degrade); color: #FFF8FB; box-shadow: 0 18px 30px -18px rgba(199, 45, 103, .8); }
  .botao.principal:hover, .botao.principal:focus-visible { transform: translateY(-2px); filter: brightness(1.06); }
  .botao.principal:hover svg { transform: translate(2px, -2px); }
  .botao.principal svg { transition: transform .2s; }
  .botao.segundo { background: var(--azul-claro); color: var(--tinta); }
  a.botao.segundo:hover, a.botao.segundo:focus-visible { transform: translateY(-2px); background: #B7CCF6; }
  .botao.em-breve { cursor: default; }
  .selo { flex-shrink: 0; padding: 5px 10px; border-radius: 999px; background: rgba(255, 255, 255, .7); font: 700 11px var(--sans); letter-spacing: .08em; color: var(--tinta-suave); }

  .redes { display: flex; justify-content: center; gap: 14px; margin: 26px 0 0; padding: 0; list-style: none; }
  .redes a {
    width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; color: var(--tinta);
    background: var(--branco); border: 1px solid rgba(43, 43, 43, .12); transition: transform .2s, border-color .2s, color .2s;
  }
  .redes a:hover, .redes a:focus-visible { transform: translateY(-2px); border-color: var(--rosa-claro); color: var(--rosa); }
  .redes svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .rodape { margin: 22px 0 0; font-size: 12px; color: var(--tinta-suave); }
  .rodape a { color: inherit; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <main class="janela">
    <div class="barra">
      <svg class="estrela" viewBox="0 0 100 100" aria-hidden="true"><path/></svg>
      <span class="barra-nome" id="barra-nome"></span>
      <button class="idioma" id="idioma" type="button"></button>
    </div>

    <div class="corpo">
      <svg class="estrela estrela-solta e1" viewBox="0 0 100 100" aria-hidden="true"><path/></svg>
      <svg class="estrela estrela-solta e2" viewBox="0 0 100 100" aria-hidden="true"><path/></svg>
      <svg class="estrela estrela-solta e3" viewBox="0 0 100 100" aria-hidden="true"><path/></svg>

      <div class="cracha-area">
        <div class="cracha-entrada esperando" id="cracha-entrada">
          <div class="cracha" id="cracha">
            <div class="cracha-pulo" id="cracha-pulo">
              <div class="cracha-cordao" aria-hidden="true"></div>
              <button class="cracha-cartao" id="cracha-cartao" type="button" aria-pressed="false">
                <span class="cracha-giro">
                  <span class="cracha-face cracha-frente" id="cracha-frente" role="img"></span>
                  <span class="cracha-face cracha-verso" id="cracha-verso" aria-hidden="true"><span class="cracha-texto" id="cracha-texto"></span></span>
                </span>
                <span class="cracha-gancho" aria-hidden="true"></span>
              </button>
            </div>
          </div>
        </div>
      </div>
      <p class="dica-cracha" id="dica-cracha"></p>

      <div class="balao"><h1 id="titulo"></h1></div>
      <p class="cargo" id="cargo"></p>
      <p class="frase" id="frase"></p>

      <div class="botoes" id="botoes"></div>
      <ul class="redes" id="redes"></ul>

      <p class="rodape"><a href="https://luanaguimaraes.com.br/">luanaguimaraes.com.br</a></p>
    </div>
  </main>

<script>
  /* ==========================================================
     LINK NA BIO
     Tudo o que aparece escrito está nas listas abaixo, em português
     e em inglês. Para mexer num botão, mexa só em BOTOES ou REDES.

     QUANDO O SITE DA EMPRESA FICAR PRONTO: no segundo botão, troque
     url: "" pelo endereço (ex: url: "https://empresa.luanaguimaraes.com.br/")
     e troque o nome. O selo "em breve" some sozinho.
     ========================================================== */
  const TEXTOS = {
    pt: {
      barra: "link-na-bio", botao: "EN", botaoNome: "Read in English",
      titulo: 'Oi, eu sou a <em>Luana!</em>',
      cargo: "Criadora UGC & designer de portfólios UGC",
      frase: "Vídeos <em>autênticos e estratégicos</em> para marcas.",
      dica: "Toque no crachá para virar", virar: "Virar o crachá", emBreve: "em breve",
      fotoAlt: "Luana Guimarães com o crachá de Criadora UGC e Designer",
      verso: 'UGC creator <span class="cracha-e">&amp;</span><br>Designer de<br>portfólios UGC'
    },
    en: {
      barra: "link-in-bio", botao: "PT", botaoNome: "Ler em português",
      titulo: 'Hi, I\'m <em>Luana!</em>',
      cargo: "UGC creator & UGC portfolio designer",
      frase: "<em>Authentic, strategic</em> videos for brands.",
      dica: "Tap the badge to flip it", virar: "Flip the badge", emBreve: "soon",
      fotoAlt: "Luana Guimarães wearing her UGC Creator and Designer badge",
      verso: 'UGC creator <span class="cracha-e">&amp;</span><br>UGC portfolio<br>designer'
    }
  };

  const BOTOES = [
    { tipo: "principal", url: "https://luanaguimaraes.com.br/", texto: "Meu portfólio UGC", texto_en: "My UGC portfolio" },
    { tipo: "segundo", url: "", texto: "Minha empresa", texto_en: "My company" } // ainda sem site: aparece "em breve"
  ];

  const REDES = [
    { nome: "Instagram", url: "https://instagram.com/luawiechetek",
      icone: '<rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6"/>' },
    { nome: "TikTok", url: "https://www.tiktok.com/@luawiechetek",
      icone: '<path d="M14 3.5v11.2a3.8 3.8 0 1 1-3.8-3.8"/><path d="M14 3.5c.4 2.6 2.2 4.4 5 4.6"/>' }
  ];

  const $ = (s) => document.querySelector(s);
  const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const reduzirMovimento = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const SETA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>';

  // mesma estrela do portfólio
  function caminhoEstrela() {
    const externos = [50, 41, 47, 38, 49, 43], desvio = [0, 6, -4, 5, -6, 3], interno = 15;
    let d = "";
    for (let i = 0; i < 6; i++) {
      const a = (-90 + i * 60 + desvio[i]) * Math.PI / 180, b = (-60 + i * 60) * Math.PI / 180;
      d += (i ? "L" : "M") + (50 + externos[i] * Math.cos(a)).toFixed(1) + " " + (50 + externos[i] * Math.sin(a)).toFixed(1);
      d += "L" + (50 + interno * Math.cos(b)).toFixed(1) + " " + (50 + interno * Math.sin(b)).toFixed(1);
    }
    return d + "Z";
  }
  const forma = caminhoEstrela();
  document.querySelectorAll("svg.estrela path").forEach((p) => p.setAttribute("d", forma));

  function desenhar(lingua) {
    const en = lingua === "en", t = TEXTOS[lingua];
    document.documentElement.lang = en ? "en" : "pt-BR";
    $("#barra-nome").textContent = t.barra;
    $("#idioma").textContent = t.botao; $("#idioma").setAttribute("aria-label", t.botaoNome);
    $("#titulo").innerHTML = t.titulo;
    $("#cargo").textContent = t.cargo;
    $("#frase").innerHTML = t.frase;
    $("#dica-cracha").textContent = t.dica;
    $("#cracha-cartao").setAttribute("aria-label", t.virar);
    $("#cracha-frente").setAttribute("aria-label", t.fotoAlt);
    $("#cracha-texto").innerHTML = t.verso;
    $("#botoes").innerHTML = BOTOES.map((b) => {
      const texto = esc(en ? b.texto_en : b.texto);
      if (!b.url) return `<span class="botao ${b.tipo} em-breve" aria-disabled="true">${texto}<span class="selo">${esc(t.emBreve)}</span></span>`;
      return `<a class="botao ${b.tipo}" href="${esc(b.url)}">${texto}${SETA}</a>`;
    }).join("");
    $("#redes").innerHTML = REDES.map((r) => `<li><a href="${esc(r.url)}" target="_blank" rel="noopener" aria-label="${esc(r.nome)}" title="${esc(r.nome)}">
      <svg viewBox="0 0 24 24" aria-hidden="true">${r.icone}</svg></a></li>`).join("");
  }

  let lingua = "pt";
  try { if (localStorage.getItem("linksLingua") === "en") lingua = "en"; } catch (_) {}
  desenhar(lingua);
  $("#idioma").addEventListener("click", () => {
    lingua = lingua === "pt" ? "en" : "pt";
    try { localStorage.setItem("linksLingua", lingua); } catch (_) {}
    desenhar(lingua);
  });

  /* ===== CRACHÁ: cai balançando ao abrir, balança com o mouse e vira ao tocar ===== */
  const cracha = $("#cracha"), crachaPulo = $("#cracha-pulo"), crachaCartao = $("#cracha-cartao");
  let balancoAmp = 0, balancoAlvo = 0, balancoFase = 0, balancoTempo = 0, balancando = false;
  function balancar(agora) {
    const dt = Math.min((agora - balancoTempo) / 1000, 0.05);
    balancoTempo = agora;
    balancoAmp += (balancoAlvo - balancoAmp) * Math.min(dt * (balancoAlvo > balancoAmp ? 1.4 : 1.5), 1);
    balancoFase += dt * (2 * Math.PI / 2.8);
    if (balancoAlvo === 0 && balancoAmp < 0.02) { cracha.style.transform = ""; balancoAmp = 0; balancando = false; return; }
    cracha.style.transform = `rotate(${(balancoAmp * Math.sin(balancoFase)).toFixed(3)}deg)`;
    requestAnimationFrame(balancar);
  }
  cracha.addEventListener("pointerenter", (e) => {
    if (e.pointerType !== "mouse" || reduzirMovimento) return;
    balancoAlvo = 6;
    if (!balancando) { balancando = true; balancoFase = 0; balancoTempo = performance.now(); requestAnimationFrame(balancar); }
  });
  cracha.addEventListener("pointerleave", () => { balancoAlvo = 0; });
  crachaCartao.addEventListener("click", () => {
    const virar = !crachaCartao.classList.contains("virado");
    crachaPulo.classList.remove("pulando"); void crachaPulo.offsetWidth; crachaPulo.classList.add("pulando");
    setTimeout(() => crachaCartao.classList.toggle("virado", virar), reduzirMovimento ? 0 : 170);
    crachaCartao.setAttribute("aria-pressed", String(virar));
    $("#cracha-frente").setAttribute("aria-hidden", String(virar));
    $("#cracha-verso").setAttribute("aria-hidden", String(!virar));
  });
  crachaPulo.addEventListener("animationend", () => crachaPulo.classList.remove("pulando"));
  crachaCartao.addEventListener("pointermove", (e) => {
    const r = crachaCartao.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 100, y = (e.clientY - r.top) / r.height * 100;
    crachaCartao.style.setProperty("--cx", x.toFixed(1) + "%");
    crachaCartao.style.setProperty("--cxi", (100 - x).toFixed(1) + "%");
    crachaCartao.style.setProperty("--cy", y.toFixed(1) + "%");
  });

  // entrada: cai do alto e vai balançando até parar
  (function entrada() {
    const caixa = $("#cracha-entrada");
    if (reduzirMovimento) { caixa.classList.remove("esperando"); return; }
    let comecou = false;
    const comecar = () => {
      if (comecou) return; comecou = true;
      const altura = caixa.getBoundingClientRect().bottom + 40;
      caixa.classList.remove("esperando");
      const inicio = performance.now();
      const quadro = (agora) => {
        const t = (agora - inicio) / 1000;
        const y = -altura * Math.pow(1 - Math.min(t / 0.9, 1), 3);
        const giro = 20 * Math.exp(-t / 1.1) * Math.cos(2 * Math.PI * t / 1.4); // balanço que vai diminuindo
        caixa.style.transform = `translate3d(0, ${y.toFixed(1)}px, 0) rotate(${giro.toFixed(2)}deg)`;
        if (t < 5) requestAnimationFrame(quadro); else caixa.style.transform = "";
      };
      requestAnimationFrame(quadro);
    };
    const foto = new Image(); foto.src = "../cracha.webp?v=4";
    (foto.decode ? foto.decode() : Promise.resolve()).then(comecar, comecar);
    setTimeout(comecar, 1500); // se a foto demorar, começa assim mesmo
  })();
</script>
</body>
</html>
