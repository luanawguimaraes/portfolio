<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Entrar | Luana Guimarães</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --fundo: #FDF8E1; --tinta: #2B2B2B; --suave: #6B6466; --rosa: #C72D67; --rosa-claro: #EA70A5; --azul: #CFDFFC; --linha: rgba(43, 43, 43, .12); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--fundo); color: var(--tinta);
    font: 14px/1.5 "Open Sans", system-ui, sans-serif; }
  .cartao { width: 100%; max-width: 360px; background: #fff; border: 1px solid var(--linha); border-radius: 14px; padding: 28px 24px; box-shadow: 0 18px 40px -26px rgba(20, 17, 13, .3); }
  h1 { margin: 0 0 4px; font-size: 18px; font-weight: 700; }
  h1 span { color: var(--rosa); }
  .sub { margin: 0 0 20px; color: var(--suave); font-size: 13px; }
  label { display: block; font-size: 12px; font-weight: 600; margin: 0 0 6px; }
  input { width: 100%; padding: 11px 12px; border: 1px solid var(--linha); border-radius: 8px; font: inherit; background: #fff; margin-bottom: 14px; }
  input:focus { outline: none; border-color: var(--rosa); box-shadow: 0 0 0 3px rgba(199, 45, 103, .15); }
  button { width: 100%; padding: 11px; border: 0; border-radius: 8px; background: var(--rosa); color: #fff; font: 600 14px "Open Sans", sans-serif; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .link { display: inline-block; margin-top: 14px; background: none; border: 0; padding: 0; width: auto; color: var(--rosa); font-weight: 600; font-size: 13px; cursor: pointer; }
  .faixa { display: none; margin-bottom: 14px; padding: 10px 12px; border-radius: 8px; font-size: 13px; }
  .faixa.erro { display: block; background: #FDE7EE; color: #9B1F4C; }
  .faixa.ok { display: block; background: #E8F6EC; color: #23683A; }
  .escondido { display: none; }
</style>
</head>
<body>
  <main class="cartao">
    <h1>Luana <span>Guimarães</span></h1>
    <p class="sub" id="sub">Entre para abrir o seu painel.</p>
    <div class="faixa" id="faixa" role="alert"></div>

    <!-- entrar -->
    <form id="form-entrar" novalidate>
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="current-password" required>
      <button type="submit" id="botao-entrar">Entrar</button>
    </form>
    <button class="link" type="button" id="esqueci">Esqueci minha senha</button>

    <!-- nova senha (aparece quando você abre o link de recuperação do e-mail) -->
    <form id="form-nova" class="escondido" novalidate>
      <label for="nova">Nova senha</label>
      <input id="nova" type="password" autocomplete="new-password" minlength="6" required>
      <button type="submit">Salvar nova senha</button>
    </form>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../js/banco.js"></script>
<script>
  const faixa = document.getElementById("faixa");
  const mostrar = (texto, tipo) => { faixa.textContent = texto; faixa.className = "faixa " + tipo; };
  const recuperando = /type=recovery/.test(location.hash);

  if (!window.banco) {
    mostrar("Não consegui conectar ao banco agora. Confira a internet e recarregue a página.", "erro");
  } else {
    // Já tem sessão aberta? Vai direto pro painel (menos quando veio do link de nova senha).
    window.banco.auth.getSession().then(({ data }) => {
      if (data && data.session && !recuperando) location.replace("../admin/");
    });
    window.banco.auth.onAuthStateChange((evento) => {
      if (evento === "PASSWORD_RECOVERY") abrirNovaSenha();
    });
    if (recuperando) abrirNovaSenha();
  }

  function abrirNovaSenha() {
    document.getElementById("form-entrar").classList.add("escondido");
    document.getElementById("esqueci").classList.add("escondido");
    document.getElementById("form-nova").classList.remove("escondido");
    document.getElementById("sub").textContent = "Escolha uma senha nova.";
  }

  document.getElementById("form-entrar").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!window.banco) return;
    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value;
    if (!email || !senha) { mostrar("Preencha o e-mail e a senha.", "erro"); return; }
    const botao = document.getElementById("botao-entrar");
    botao.disabled = true; botao.textContent = "Entrando...";
    const { error } = await window.banco.auth.signInWithPassword({ email, password: senha });
    botao.disabled = false; botao.textContent = "Entrar";
    if (error) { mostrar("E-mail ou senha incorretos", "erro"); return; }
    location.replace("../admin/");
  });

  document.getElementById("esqueci").addEventListener("click", async () => {
    if (!window.banco) return;
    const email = document.getElementById("email").value.trim();
    if (!email) { mostrar("Escreva o seu e-mail no campo acima e clique de novo em \"Esqueci minha senha\".", "erro"); return; }
    const { error } = await window.banco.auth.resetPasswordForEmail(email, { redirectTo: location.origin + "/login/" });
    if (error) mostrar("Não consegui enviar o e-mail agora. Tente de novo daqui a alguns minutos.", "erro");
    else mostrar("Pronto! Se esse e-mail estiver cadastrado, chega um link para criar uma senha nova.", "ok");
  });

  document.getElementById("form-nova").addEventListener("submit", async (e) => {
    e.preventDefault();
    const nova = document.getElementById("nova").value;
    if (nova.length < 6) { mostrar("A senha precisa ter pelo menos 6 caracteres.", "erro"); return; }
    const { error } = await window.banco.auth.updateUser({ password: nova });
    if (error) { mostrar("Não consegui salvar a senha. Abra o link do e-mail de novo.", "erro"); return; }
    mostrar("Senha nova salva! Abrindo o painel...", "ok");
    setTimeout(() => location.replace("../admin/"), 1200);
  });
</script>
</body>
</html>
